[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-sdk"
version = "0.1.0"
readme= "README.md"
description = "SDK for creating plugins and scripts for Flux"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flux_sdk"]
