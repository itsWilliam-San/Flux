name: Flux test-on-pr

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    FORCE_COLOR: 1

permissions: {}

jobs:
    build:
        name: Test (${{ matrix.platform.os }})
        strategy:
            fail-fast: false
            matrix:
                platform:
                    - os: linux
                      runs_on: ubuntu-22.04
                    - os: windows
                      runs_on: windows-latest

        runs-on: ${{ matrix.platform.runs_on }}

        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: "false"

            - name: Install Linux Dependencies
              if: matrix.platform.os == 'linux'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends \
                       libwebkit2gtk-4.1-dev \
                       build-essential \
                       curl \
                       wget \
                       file \
                       libxdo-dev \
                       libssl-dev \
                       libayatana-appindicator3-dev \
                       librsvg2-dev

            - name: install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - uses: swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.platform.os }}
            - uses: pnpm/action-setup@v6
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install JS dependencies
              run: pnpm install --frozen-lockfile

            - name: Setup Python Runtime (Linux)
              if: matrix.platform.os == 'linux'
              run: bash scripts/setup-python.sh

            - name: Setup Python Runtime (Windows)
              if: matrix.platform.os == 'windows'
              shell: powershell
              run: ./scripts/setup-python.ps1

            - name: Build Tauri App
              uses: tauri-apps/tauri-action@v1
