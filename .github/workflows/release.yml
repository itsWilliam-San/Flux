name: "Flux Alpha Publish"

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: action/checkout@v6

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        run: pnpm install

      - name: Setup Python Runtime (Linux)
        if: matrix.platform.os == 'linux'
        run: bash scripts/setup-python.sh

      - name: Setup Python Runtime (Windows)
        if: matrix.platform.os == 'windows'
        shell: powershell
        run: ./scripts/setup-python.ps1

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: flux-v__VERSION__
          releaseName: "Flux v__VERSION__"
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
