name: Flux CI primary

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    FORCE_COLOR: 1

permissions: {}

jobs:
    build:
        name: Build (${{ matrix.platform.os }})
        strategy:
            fail-fast: false
            matrix:
                platform:
                    - os: linux
                      runs_on: ubuntu-latest
                    - os: windows
                      runs_on: windows-latest

        runs-on: ${{ matrix.platform.runs_on }}

        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credential: false

            - name: Install Linux Dependencies
              if: matrix.platform.os == 'linux'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends \
                       libwebkit2gtk-4.1-dev \
                       build-essential \
                       curl \
                       wget \
                       file \
                       libxdo-dev \
                       libssl-dev \
                       libayatana-appindicator3-dev \
                       librsvg2-dev
            - uses: dtolnay/rust-toolchain@stable
            - uses: swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.platform.os }}
            - uses: pnpm/action-setup@v6
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: "pnpm"
            - name: Create Python VENV
              uses: actions/setup-python@v5
              with:
                  python-version: "3.14"
                  cache: "pip"

            - name: Install Python Dependencies (Linux / macOS)
              if: matrix.platform.os != 'windows'
              run: |
                  python -m venv venv
                  . venv/bin/activate
                  pip install --upgrade pip
                  pip install openpyxl

            - name: Install Python Dependencies (Windows)
              if: matrix.platform.os == 'windows'
              run: |
                  python -m venv venv
                  ./venv/Scripts/Activate.ps1
                  pip install --upgrade pip
                  pip install openpyxl

            - name: Install JS dependencies
              run: pnpm install --frozen-lockfile
            - name: Test Rust Code
              run: |
                  cd src-tauri
                  cargo check

            - name: Download and Setup Portable Python Runtime
              shell: bash
              run: |
                  mkdir -p python-runtime/

                  if [ "${{ matrix.platform.os }}" == "windows" ]; then
                      echo "Configurando Python Portable para Windows..."
                      curl -L https://www.python.org/ftp/python/3.14.9/python-3.14.9-embed-amd64.zip -o python.zip
                      unzip python.zip -d src-tauri/resources/python-runtime
                      rm python.zip

                      # 1. Baixar o get-pip.py para instalar o gerenciador de pacotes no Windows embeddable
                      curl -L https://bootstrap.pypa.io/get-pip.py -o get-pip.py
                      ./python-runtime/python.exe get-pip.py --no-warn-script-location
                      rm get-pip.py

                      # 2. Instalar as bibliotecas padrão que você quer embutir
                      ./python-runtime/python.exe -m pip install --no-warn-script-location openpyxl pydantic
                  else
                      echo "Configurando Python Standalone para Linux..."
                      curl -L https://github.com/astral-sh/python-build-standalone/releases/download/20261021/cpython-3.14.9+20261021-x86_64-unknown-linux-gnu-install_only.tar.gz -o python.tar.gz
                      tar -xzf python.tar.gz -C python-runtime/ --strip-components=1
                      rm python.tar.gz

                      # O Python Standalone do Linux geralmente já vem com ensurepip ou pip integrado.
                      # Garantimos que o pip está atualizado e instalamos os pacotes:
                      ./python-runtime/bin/python3 -m ensurepip --default-pip || true
                      ./python-runtime/bin/python3 -m pip install --upgrade pip
                      ./python-runtime/bin/python3 -m pip install openpyxl pydantic
                  fi

            - name: Fix Windows Python Embeddable Path
              if: matrix.platform.os == 'windows'
              run: |
                  $pthFile = "python-runtime/python314._pth"
                  # Descomenta 'import site' para que o Python embeddable enxergue as pastas de pacotes instalados (site-packages)
                  (Get-Content $pthFile) -replace '#import site', 'import site' | Set-Content $pthFile
              shell: powershell

            - name: Build Tauri App
              run: pnpm tauri build --config src-tauri/tauri.build.conf.json
